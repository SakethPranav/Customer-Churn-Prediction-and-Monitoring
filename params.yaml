data:
  raw_path: data/raw/telco_churn.csv
  processed_path: data/processed/telco_clean.csv
  target: Churn
  id_column: customerID

featurize:
  input_path: data/processed/telco_clean.csv
  output_path: data/processed/telco_features.csv
  metrics_path: metrics/featurize_timing.json
  n_partitions: 4
  num_cpus: 4

split:
  input_path: data/processed/telco_features.csv
  train_path: data/processed/train.csv
  test_path: data/processed/test.csv
  test_size: 0.2
  random_state: 42

train:
  tracking_uri: http://127.0.0.1:5000
  experiment_name: churn-prediction
  registered_model_name: churn-model
  cv_folds: 5
  random_state: 42
  models:
    logistic_regression:
      C: 1.0
      max_iter: 1000
    random_forest:
      n_estimators: 300
      max_depth: 8
      min_samples_leaf: 5
    xgboost:
      n_estimators: 300
      max_depth: 4
      learning_rate: 0.05

monitoring:
  train_path: data/processed/train.csv
  reference_path: monitoring/reference_stats.json
  n_bins: 10
  window_size: 300
  min_window: 300
  psi_warn: 0.1
  psi_alert: 0.25
  perf_window: 500
  perf_min_labelled: 500
  perf_min_per_class: 10
  perf_pr_auc_floor: 0.54
  numeric_features: [tenure, MonthlyCharges, TotalCharges]
  categorical_features: [gender, SeniorCitizen, Partner, Dependents, PhoneService,
    MultipleLines, InternetService, OnlineSecurity, OnlineBackup, DeviceProtection,
    TechSupport, StreamingTV, StreamingMovies, Contract, PaperlessBilling,
    PaymentMethod]
