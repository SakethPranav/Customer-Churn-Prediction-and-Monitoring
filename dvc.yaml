stages:
  clean_data:
    cmd: python src/pipeline/clean_data.py
    deps:
    - data/raw/telco_churn.csv
    - src/pipeline/clean_data.py
    params:
    - data
    outs:
    - data/processed/telco_clean.csv
  featurize:
    cmd: python src/pipeline/featurize.py
    deps:
    - data/processed/telco_clean.csv
    - src/common/features.py
    - src/pipeline/featurize.py
    params:
    - featurize
    outs:
    - data/processed/telco_features.csv
    metrics:
    - metrics/featurize_timing.json:
        cache: false
  split:
    cmd: python src/pipeline/split_data.py
    deps:
    - data/processed/telco_features.csv
    - src/pipeline/split_data.py
    params:
    - data.target
    - split
    outs:
    - data/processed/test.csv
    - data/processed/train.csv
  train:
    cmd: python src/training/train.py
    deps:
    - data/processed/test.csv
    - data/processed/train.csv
    - src/training/train.py
    params:
    - data.target
    - train
    outs:
    - models/best_model.joblib
    metrics:
    - metrics/train_metrics.json:
        cache: false
  reference_stats:
    cmd: python src/monitoring/build_reference.py
    deps:
    - data/processed/train.csv
    - src/monitoring/build_reference.py
    - src/monitoring/drift.py
    params:
    - monitoring.categorical_features
    - monitoring.min_window
    - monitoring.n_bins
    - monitoring.numeric_features
    - monitoring.psi_alert
    - monitoring.psi_warn
    - monitoring.reference_path
    - monitoring.train_path
    - monitoring.window_size
    outs:
    - monitoring/reference_stats.json:
        cache: false
